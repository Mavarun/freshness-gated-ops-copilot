[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-copilot"
version = "0.1.0"
description = "Ops knowledge copilot that refuses to answer when evidence fails a freshness SLA or a grounding check."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "M.Varun", email = "116015799+Mavarun@users.noreply.github.com" },
]
license = { text = "MIT" }
dependencies = [
  "pandas>=2.1",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Mavarun/freshness-gated-ops-copilot"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
