name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-and-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run golden eval (global vs per-source)
        run: python scripts/run_eval.py

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            artifacts/eval_report.md
            artifacts/eval_metrics.json
            artifacts/eval_comparison.md
            artifacts/eval_comparison.json
