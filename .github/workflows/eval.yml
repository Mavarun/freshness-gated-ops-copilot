name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-and-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest

      - name: Run golden eval (global vs per-source)
        run: python scripts/run_eval.py

      # Report-only: accuracy drops under perturbation are the finding and never
      # fail the build. A crash (non-zero exit) still fails the job.
      - name: Robustness report (clean vs perturbed, non-gating on accuracy)
        run: python scripts/run_robustness.py

      # Report-only: the fresh hand-written general-English synonym set (fails
      # only if its vocabulary overlaps the perturbation split, or on a crash).
      - name: Fresh synonym set (word-vector backoff on/off, non-gating on accuracy)
        run: python scripts/run_fresh_synonym_eval.py

      # Report-only: the dev2 calibration set (fails only if it gains a
      # held-out word, shares swap vocabulary, or its frozen split moves).
      - name: dev2 calibration set (default vs WordNet dev2-chosen, non-gating on accuracy)
        run: python scripts/run_dev2_eval.py

      # Report-only: the dev3 set (fails only if it gains a held-out word,
      # shares or repeats swap vocabulary, or its source-grouped split moves).
      - name: dev3 set (default vs context-gated Datamuse arms, non-gating on accuracy)
        run: python scripts/run_dev3_eval.py

      # Report-only on accuracy: the dev4 set (fails if it gains a held-out
      # word anywhere in the file, shares or repeats swap vocabulary, its
      # source-grouped split moves, or the shipped default opens a must-refuse row).
      - name: dev4 set (default vs unknown-words-only Datamuse arm, non-gating on accuracy)
        run: python scripts/run_dev4_eval.py

      # Report-only on accuracy: the dev5 set, tune half only (its confirm
      # half is unspent). Fails on held-out words, shared or repeated swap
      # vocabulary, split drift, or a default must-refuse open other than the
      # known d5-38 bug (pinned by a strict xfail).
      - name: dev5 set (shipped default on the tune half, non-gating on accuracy)
        run: python scripts/run_dev5_eval.py

      # Report-only on accuracy: dev6 (spent 2026-10-26 by the one-shot
      # Datamuse confirm). Fails on held-out words, shared or repeated swap
      # vocabulary, a row-count change, or any default must-refuse open.
      - name: dev6 set (shipped default, non-gating on accuracy)
        run: python scripts/run_dev6_eval.py

      # Gating on safety: the 36 attribute traps (What flavour / price / salary
      # is <known page>?). Fails if the shipped default opens any of them, the
      # split drifts or a held-out word enters the file.
      - name: Attribute traps (shipped vs pre-change default)
        run: python scripts/run_attribute_traps_eval.py

      # Gating: exits non-zero if any refusal explanation, or any redacted trace
      # line (query / reason / write parse), leaks a canary token, PII or a
      # secret, or a golden explanation check fails.
      - name: Refusal-explanation eval (golden + perturbed + leak probes)
        run: python scripts/run_explanation_eval.py

      # Gating: exits non-zero if the random-token detector flags any repo-text
      # negative, misses a dev-family secret, or its calibration drifts from
      # the committed threshold.
      - name: Random-token secret detector (calibration + FPR gate)
        run: python scripts/run_secret_entropy_eval.py

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-artifacts
          path: |
            artifacts/eval_report.md
            artifacts/eval_metrics.json
            artifacts/eval_comparison.md
            artifacts/eval_comparison.json
            artifacts/robustness_report.md
            artifacts/robustness_metrics.json
            artifacts/explanation_eval.md
            artifacts/secret_entropy_eval.md
            artifacts/secret_entropy_eval.json
            artifacts/explanation_eval.json
            artifacts/synonym_fresh_eval.md
            artifacts/synonym_fresh_eval.json
            artifacts/synonym_dev2_eval.md
            artifacts/synonym_dev2_eval.json
            artifacts/synonym_dev3_eval.md
            artifacts/synonym_dev3_eval.json
            artifacts/synonym_dev4_eval.md
            artifacts/synonym_dev4_eval.json
            artifacts/synonym_dev5_eval.md
            artifacts/synonym_dev5_eval.json
            artifacts/synonym_dev6_eval.md
            artifacts/synonym_dev6_eval.json
            artifacts/attribute_traps_eval.md
            artifacts/attribute_traps_eval.json
